    <script type="text/javascript">
      moment.locale("id-ID");
      var currentDate = new Date();
      var timeFormat = 1;
      switchFormat(0);
    
      function pilih_kota() {
        var kota = getQueryVariable("kota");
        // Daftar koordinat dan timezone kota
        switch (parseInt(kota)) {
          case 1: geo = [-2.63, 140.58, 134.35]; timezone = +9; break;
          case 2: geo = [-7.25599, 110.406585, 520.42]; timezone = +7; break;
          case 51: geo = [-6.211544, 106.845172, 10.22]; timezone = +7; break;
          // ... tambahkan semua kota lain seperti sebelumnya
          default: geo = [-6.211544, 106.845172, 10.22]; timezone = +7;
        }
      }
    
      // display timetable for current month (ignored, full Ramadhan used)
      function displayMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + 1 * offset);
        var month = currentDate.getMonth();
        var year = currentDate.getFullYear();
        makeTable(year, month, geo, timezone);
      }
    
      // make full Ramadhan timetable
      function makeTable(year, month, geo, timeZone) {
        prayTimes.tune({
          imsak: 2,
          subuh: 2,
          dhuhur: 3,
          ashar: 3,
          maghrib: 4,
          isya: 2,
        });
    
        var items = {
          day: "Tanggal",
          imsak: "Imsak",
          subuh: "Subuh",
          dhuhur: "Dhuhur",
          ashar: "Ashar",
          maghrib: "Maghrib",
          isya: "Isya",
        };
    
        var tbody = document.createElement("tbody");
        tbody.appendChild(makeTableRow(items, items, "TabTitleJadwal head"));
    
        // Mulai dari tanggal 1 Ramadhan tahun Hijriyah saat ini
        var hijriYear = moment().iYear();
        var ramadhanStart = moment()
          .iYear(hijriYear)
          .iMonth(8) // 8 = Ramadhan (index 0 = Muharram)
          .iDate(1);
    
        // Loop hingga akhir Ramadhan (29-30 hari)
        var x = 1;
        var date = ramadhanStart.clone();
        while (true) {
          var hijriMonth = date.iMonth();
          if (hijriMonth !== 8) break; // Stop jika sudah bukan Ramadhan
    
          var hijriDateStr = date.format("iD iMMMM iYYYY");
          var klass = x % 2 !== 0 ? "TabListJadwal bg1" : "TabListJadwal bg2";
    
          // Konversi ke Gregorian untuk waktu sholat
          var gregDate = date.toDate();
          var times = prayTimes.getTimes(gregDate, geo, timeZone);
          times.day = hijriDateStr;
    
          tbody.appendChild(makeTableRow(times, items, klass));
    
          date.add(1, "days");
          x++;
        }
    
        removeAllChild($("timetable"));
        $("timetable").appendChild(tbody);
      }
    
      // make a table row
      function makeTableRow(data, items, klass) {
        var row = document.createElement("tr");
        for (var i in items) {
          var cell = document.createElement("td");
          cell.innerHTML = data[i];
          cell.style.width = i === "day" ? "130px" : "3.7em";
          if (
            (i == "imsak" && data[i] !== "Imsak") ||
            (i == "maghrib" && data[i] !== "Maghrib")
          ) {
            if (klass === "TabListJadwal bg1" && klass !== "TabListJadwal bg1 active") {
              cell.style.background = "#F8F2E9";
            }
            if (klass === "TabListJadwal bg2" && klass !== "TabListJadwal bg2 active") {
              cell.style.background = "#fff";
            }
          }
          row.appendChild(cell);
        }
        row.className = klass;
        return row;
      }
    
      // remove all children of a node
      function removeAllChild(node) {
        if (!node) return;
        while (node.firstChild) node.removeChild(node.firstChild);
      }
    
      // switch time format
      function switchFormat(offset) {
        var formats = ["24-hour", ""];
        timeFormat = (timeFormat + offset) % 2;
        $("time-format").innerHTML = formats[timeFormat];
        show();
      }
    
      // show timetable
      function show() {
        pilih_kota();
        displayMonth(0);
      }
    
      // return month full name
      function monthFullName(month) {
        var monthName = [
          "Januari","Februari","Maret","April","Mei","Juni","Juli",
          "Agustus","September","Oktober","November","Desember"
        ];
        return monthName[month];
      }
    
      function $(id) { return document.getElementById(id); }
    
      function getQueryVariable(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split("=");
          if (pair[0] == variable) return pair[1];
        }
        return 51; // default Jakarta
      }
    
      window.onload = function () {
        show();
        window.print();
      };
    </script>
