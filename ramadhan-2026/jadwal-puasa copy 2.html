    <script>
      document.addEventListener("DOMContentLoaded", () => {
      
        const kotaSelect = document.getElementById("provinsi-select");
        const jadwalBody = document.getElementById("jadwal-body");
        const judulJadwal = document.getElementById("judul-jadwal");
      
        /* ======================
           LOAD KOTA DARI API
        ====================== */
        fetch("https://api.myquran.com/v2/sholat/kota/semua")
          .then(res => res.json())
          .then(res => {
            kotaSelect.innerHTML = "";
      
            res.data.forEach(kota => {
              const opt = document.createElement("option");
              opt.value = kota.id;
              opt.textContent = kota.lokasi;
      
              if (kota.lokasi.toLowerCase().includes("jakarta")) {
                opt.selected = true;
              }
      
              kotaSelect.appendChild(opt);
            });
      
            loadJadwalPuasaSholat(); // load awal
          })
          .catch(err => {
            console.error("Gagal load kota:", err);
            kotaSelect.innerHTML = `<option value="">Error load kota</option>`;
          });
      
        /* ======================
           LOAD JADWAL RAMADHAN 30 HARI
        ====================== */
        window.loadJadwalPuasaSholat = function () {
          const idKota = kotaSelect.value;
          let namaKota = kotaSelect.options[kotaSelect.selectedIndex].text;
      
          // Hapus kata "KOTA" atau "KAB." di depan jika duplikat
          namaKota = namaKota.replace(/^(KOTA|KAB\.)\s+/i, match => match.toUpperCase());
      
          const ramadhanStart = new Date('2026-02-18'); // 1 Ramadhan 1447
          const ramadhanYear = 1447;
          const totalHari = 30;
      
          if (!idKota) return;
      
          // Update judul tanpa duplikat
          judulJadwal.innerHTML = `<span class="uppercase">JADWAL IMSYAKIYAH ${namaKota.toUpperCase()}</span>`;
      
          jadwalBody.innerHTML = `<tr><td colspan="8">Loading...</td></tr>`;
      
          const monthsToFetch = [ramadhanStart.getMonth() + 1, ramadhanStart.getMonth() + 2];
          const year = ramadhanStart.getFullYear();
      
          Promise.all(
            monthsToFetch.map(month =>
              fetch(`https://api.myquran.com/v2/sholat/jadwal/${idKota}/${year}/${month}`)
                .then(res => res.json())
                .then(res => res.data.jadwal)
            )
          )
          .then(results => {
            let allJadwal = results.flat();
            jadwalBody.innerHTML = "";
      
            for (let i = 0; i < totalHari; i++) {
              const currentDate = new Date(ramadhanStart);
              currentDate.setDate(ramadhanStart.getDate() + i);
      
              const dd = String(currentDate.getDate()).padStart(2, '0');
              const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
              const yyyy = currentDate.getFullYear();
              const tanggalText = `${dd}-${mm}-${yyyy} - ${i + 1} Ramadhan ${ramadhanYear}`;
      
              const dayData = allJadwal[i] || { imsak: "-", subuh: "-", dzuhur: "-", ashar: "-", maghrib: "-", isya: "-" };
              const no = i + 1;
      
              jadwalBody.innerHTML += `
                <tr>
                  <td style="text-align:center; padding:4px;  width:10px;">${no}</td>
                  <td style="padding:4px ; width:300px;">${tanggalText}</td>
                  <td style="text-align:center; padding:4px">${dayData.imsak}</td>
                  <td style="text-align:center; padding:4px">${dayData.subuh}</td>
                  <td style="text-align:center; padding:4px">${dayData.dzuhur}</td>
                  <td style="text-align:center; padding:4px">${dayData.ashar}</td>
                  <td style="text-align:center; padding:4px">${dayData.maghrib}</td>
                  <td style="text-align:center; padding:4px">${dayData.isya}</td>
                </tr>
              `;
            }
          })
          .catch(err => {
            console.error("Gagal load jadwal:", err);
            jadwalBody.innerHTML = `<tr><td colspan="8">Error load jadwal</td></tr>`;
          });
        };
      
        // Update jadwal saat kota diganti
        kotaSelect.addEventListener("change", loadJadwalPuasaSholat);
      
      });
      </script>
