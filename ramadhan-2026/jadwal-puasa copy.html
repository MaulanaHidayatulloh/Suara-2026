    <script>
      document.addEventListener("DOMContentLoaded", function(){

      const kotaSelect = document.getElementById("provinsi-select");
      const jadwalBody = document.getElementById("jadwal-body");
      const judulJadwal = document.getElementById("judul-jadwal");


      /* LOAD KOTA */
      fetch("https://api.myquran.com/v2/sholat/kota/semua")
      .then(r=>r.json())
      .then(res=>{

      kotaSelect.innerHTML="";

      res.data.forEach(kota=>{

      let opt=document.createElement("option");
      opt.value=kota.id;
      opt.textContent=kota.lokasi;

      if(kota.lokasi.toLowerCase().includes("jakarta")){
      opt.selected=true;
      }

      kotaSelect.appendChild(opt);

      });

      loadJadwal();

      });


      function loadJadwal(){

      let idKota=kotaSelect.value;
      let namaKota=kotaSelect.options[kotaSelect.selectedIndex].text;

      judulJadwal.innerHTML=
        "JADWAL IMSYAKIYAH "+namaKota.toUpperCase();


      Promise.all([

      fetch(`https://api.myquran.com/v2/sholat/jadwal/${idKota}/2026/2`).then(r=>r.json()),
      fetch(`https://api.myquran.com/v2/sholat/jadwal/${idKota}/2026/3`).then(r=>r.json())

      ])

      .then(data=>{

      let feb=data[0].data.jadwal;
      let mar=data[1].data.jadwal;

      /* ubah object ke array */
      let arrFeb=Object.values(feb);
      let arrMar=Object.values(mar);

      /* gabung */
      let semua=[...arrFeb,...arrMar];

      jadwalBody.innerHTML="";

      /* mulai dari 19 feb = index 18 */
      let startIndex=18;

      for(let i=0;i<30;i++){

      let d=semua[startIndex+i] || {};

      jadwalBody.innerHTML+=`
          <tr class="text-center">
          <td class="p-1 no">${i+1}</td>
          <td class="p-1">${i+1} Ramadhan 1447</td>
          <td class="p-1">${d.imsak || "-"}</td>
          <td class="p-1">${d.subuh || "-"}</td>
          <td class="p-1">${d.dzuhur || "-"}</td>
          <td class="p-1">${d.ashar || "-"}</td>
          <td class="p-1">${d.maghrib || "-"}</td>
          <td class="p-1 jisya">${d.isya || "-"}</td>
          </tr>
          `;

        }

      });

      }

      kotaSelect.addEventListener("change",loadJadwal);

      });
      </script>
