<script>
  // Fungsi utama untuk format ribuan dan hitung
  function formatAndCalculate(input) {
    // 1. Ambil value, hapus semua karakter selain angka
    let val = input.value.replace(/[^0-9]/g, '');
    
    // 2. Format input menjadi ribuan (titik)
    if (val !== "") {
        input.value = Number(val).toLocaleString('id-ID');
    } else {
        input.value = "";
    }

    // 3. Jalankan kalkulasi
    calculateAll();
  }

  function calculateAll() {
    // Ambil angka murni (tanpa titik)
    const gaji = parseInt(document.getElementById('inputGaji').value.replace(/\./g, '')) || 0;
    const potongan = parseInt(document.getElementById('inputPotongan').value.replace(/\./g, '')) || 0;

    const bersih = Math.max(0, gaji - potongan);
    const zakat = Math.floor(bersih * 0.025); // Pembulatan ke bawah

    // Update tampilan hasil
    document.getElementById('txtBersih').innerText = "Rp " + bersih.toLocaleString('id-ID');
    document.getElementById('txtZakat').innerText = "Rp " + zakat.toLocaleString('id-ID');
  }

  function resetZakat() {
    document.getElementById('inputGaji').value = '';
    document.getElementById('inputPotongan').value = '';
    calculateAll();
  }
</script>
